<!DOCTYPE html>
<html lang="th">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>wannnphoneee</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="game-shell">
      <header class="topbar">
        <div>
          <p class="label">Mini game</p>
          <h1>wannnphoneee</h1>
        </div>
        <div class="scoreboard">
          <div class="stat">
            <span>Coins</span>
            <strong id="coins">0</strong>
          </div>
          <div class="stat">
            <span>Power</span>
            <strong id="power">1</strong>
          </div>
          <div class="stat">
            <span>Level</span>
            <strong id="level">1</strong>
          </div>
        </div>
      </header>

      <main class="play-area">
        <button id="phoneButton" class="phone-button" aria-label="Tap the phone">
          <span class="phone-glow"></span>
          <span class="phone-icon">📱</span>
          <span class="tap-text">Tap!</span>
        </button>

        <div class="stat-panel">
          <div class="mini-stat">
            <span>Per tap</span>
            <strong id="tapValue">1</strong>
          </div>
          <div class="mini-stat">
            <span>Auto</span>
            <strong id="autoIncome">0</strong>/s
          </div>
          <div class="mini-stat">
            <span>Goal</span>
            <strong id="goalText">10</strong>
          </div>
        </div>
      </main>

      <section class="shop">
        <button id="upgradeTap" class="shop-button primary">
          Upgrade tap +1
          <small id="tapCost">Cost: 10</small>
        </button>
        <button id="boostAuto" class="shop-button secondary">
          Auto income +1/s
          <small id="autoCost">Cost: 20</small>
        </button>
        <button id="resetGame" class="shop-button ghost">Reset</button>
      </section>

      <div id="toast" class="toast" aria-live="polite">Nice!</div>
    </div>

    <script src="script.js"></script>
  </body>
</html>
